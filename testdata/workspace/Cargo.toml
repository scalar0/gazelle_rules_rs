[workspace]
members = [
  "crates/*",
]
resolver = "3"

[workspace.package]
description = "This fixture tests Cargo package metadata.\nIt includes a \"quoted\" word."
edition = "2024"
rust-version = "1.85"
version = "1.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = {level = "warn", priority = -1}

[workspace.metadata.rules_rs]
test_timeout = "short"

[workspace.metadata.schemas]
catalog = "schemas"

[package]
edition.workspace = true
name = "root-probe"
version.workspace = true

[dependencies]
probe = {path = "crates/probe"}
