[package]
edition = "2024"
name = "probe"
version = "0.1.0"

[lib]
crate-type = [
  "cdylib",
  "rlib",
  "staticlib",
]

[features]
checked = []
default = [
  "checked",
]

[[bench]]
harness = false
name = "smoke"

[[example]]
crate-type = [
  "rlib",
  "staticlib",
]
name = "ffi"

[package.metadata.resources]
files = [
  "resources/message.txt",
]

[dependencies]
itoa = "=1.0.18"
probe-macros = {path = "../macros"}
