name: Compatibility
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: compatibility-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
    DO_NOT_TRACK: '1'
    ASPECT_WRAPPER_SKIP: '1'
    BAZELISK_SKIP_WRAPPER: '1'
jobs:
    test:
        name: ${{ matrix.host }}
        runs-on: ${{ matrix.host }}
        timeout-minutes: 45
        env:
            GAZELLE_ASPECT_REMOTE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'cache' || 'none' }}
        strategy:
            fail-fast: false
            matrix:
                host: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              with:
                  aspect-api-token: ${{ env.GAZELLE_ASPECT_REMOTE == 'cache' && secrets.ASPECT_API_TOKEN || '' }}
                  bazelrc-generate: false
                  repository-cache: false
                  bazelisk-cache: true
            - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
              with:
                  just-version: '1.58.0'
            - name: Install hook test dependencies
              shell: bash
              run: |
                  if ! command -v rg >/dev/null; then
                    if [[ "$RUNNER_OS" == "Linux" ]]; then
                      sudo apt-get update
                      sudo apt-get install --yes ripgrep
                    else
                      brew install ripgrep
                    fi
                  fi
            - name: Run full validation
              run: just check-full
